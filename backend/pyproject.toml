[project]
name = "softcast"
version = "0.1.0"
description = "Prototipo SoftCast: grafo de red, GNN y autómata finito"
requires-python = ">=3.12,<3.13"
dependencies = [
    "networkx",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "torch==2.14.1",  # la versión con la que se entrenaron los modelos de modelos/
    "torch_geometric",
    "fastapi",
    "uvicorn",
    "pydantic",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["softcast"]
